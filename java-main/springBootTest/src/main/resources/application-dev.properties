server.port=8081

# ===== MySQL 数据源 =====
spring.datasource.url=jdbc:mysql://localhost:3306/bikini_bottom?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis-Plus =====
# 下划线转驼峰（create_time -> createTime）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 控制台打印 SQL，联调完成后可关闭
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 主键自增
mybatis-plus.global-config.db-config.id-type=auto

# ===== JWT =====
# 签名密钥（HS256，至少 32 字节；生产环境务必换成更长的随机串，并放到环境变量中）
jwt.secret=bikini-bottom-spongebob-jwt-secret-key-2026
# 过期时间（分钟）
jwt.expire-minutes=120
